<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The People I've Passed</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: #f0ede8;
      font-family: 'Jost', sans-serif;
      padding: 3rem;
    }

    /* image protection */
    img {
      -webkit-user-drag: none;
      user-select: none;
    }

    .back-link {
      color: rgba(240,237,232,0.6);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

     .back-link:hover {
      opacity: 1;
    }

    .gallery-header {
      margin: 4rem 0;
    }

    .gallery-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      font-weight: 300;
      margin-bottom: 1rem;
    }

     .gallery-title span {
      display: inline-block;
      transform: translateY(100%);
      animation: titleReveal 1s forwards;
    }

    @keyframes titleReveal {
      to {
        transform: translateY(0);
      }
    }

    .gallery-description {
      max-width: 600px;
      line-height: 1.8;
      color: rgba(240,237,232,0.6);
    }

    .gallery-grid {
      column-count: 2;
      column-gap: 1rem;

      max-width: 1500px;
      margin: 0 auto;

      animation: pageFade 1.4s ease;
    }

    .gallery-grid img {
      width: 100%;
      display: block;
       margin-bottom: 1rem;

      break-inside: avoid;
      border-radius: 2px;

      transition:
        transform 0.4s ease,
        opacity 0.4s ease,
        filter 0.4s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.02) translateY(-4px);
      filter: brightness(1.05);
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition:
        opacity 1.2s ease,
        transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-header {
      animation: pageFade 1.4s ease;
    }

    @keyframes pageFade {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 1.5rem;
      }

      .gallery-grid {
        column-count: 1;
      }

      .gallery-title {
        font-size: 2.5rem;
      }
    }
    
      /* LIGHTBOX */
      .lightbox {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.72);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);

        display: flex;
        align-items: center;
        justify-content: center;

        opacity: 0;
        visibility: hidden;
        pointer-events: none;

        transition: opacity 0.35s ease, visibility 0.35s ease;
        z-index: 999;
      }

      .lightbox.active {
        opacity: 1;
        visibility: visible;
        pointer-events: auto;
      }

      .lightbox img {
        max-width: 90vw;
        max-height: 88vh;
        object-fit: contain;

        transform: scale(0.92);
        opacity: 0;

        transition: transform 0.45s cubic-bezier(0.22, 1, 0.36, 1),
                    opacity 0.35s ease;

        border-radius: 6px;
      }

      .lightbox.active img {
        transform: scale(1);
        opacity: 1;
      }

  </style>
</head>

<body>

  <a href="portfolio.html" class="back-link">
    ← Back to Portfolio
  </a>

  <div class="gallery-header">
    <h1 class="gallery-title">
      <span>the people i've passed</span>
    </h1>

    <p class="gallery-description">
      to all who let me see and hold their moments in frame, thank you.
    </p>
  </div>

  <div class="gallery-grid">

    <img src="images/people1.JPG">
    <img src="images/people2.JPG">

  </div>

    <!-- right click protection -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("img").forEach(img => {
        img.addEventListener("contextmenu", e => e.preventDefault());
      });
    });
  </script>

  <!-- reveal on scroll -->
  <script>
    const reveals = document.querySelectorAll(".reveal");

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        } else {
          entry.target.classList.remove("visible");
        }
      });
    }, {
      threshold: 0.15
    });

    reveals.forEach(reveal => {
      observer.observe(reveal);
    });
  </script>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox">
    <img id="lightbox-img" src="">
  </div>

  <script>
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightbox-img");

  document.querySelectorAll(".gallery-grid img").forEach(img => {
    img.addEventListener("click", () => {
      lightboxImg.style.opacity = 0; // hide first

      lightbox.classList.add("active");
      lightboxImg.src = img.src;

      // wait a frame so transition actually triggers
      requestAnimationFrame(() => {
        lightboxImg.style.opacity = 1;
      });
    });
  });

  lightbox.addEventListener("click", () => {
    lightbox.classList.remove("active");
  });
</script>

</body>
</html>
