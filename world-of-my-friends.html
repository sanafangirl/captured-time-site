<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>World of My Friends</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: #f0ede8;
      font-family: 'Jost', sans-serif;
      padding: 3rem;
    }

    /* image protection */
    img {
      -webkit-user-drag: none;
     user-select: none;
    }

    .back-link {
      color: rgba(240,237,232,0.6);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    .gallery-header {
      margin: 4rem 0;
    }

    .gallery-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      font-weight: 300;
      margin-bottom: 1rem;
    }

    .gallery-description {
      max-width: 600px;
      line-height: 1.8;
      color: rgba(240,237,232,0.6);
    }

    .gallery-grid {
      column-count: 2;
      column-gap: 1rem;

      max-width: 1500px;
      margin: 0 auto;
    }

    .gallery-grid img {
      width: 100%;
      display: block;
      margin-bottom: 1rem;

      break-inside: avoid;
      border-radius: 2px;

      transition: transform 0.35s ease, opacity 0.35s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.02) translateY(-4px);
    }

    .reveal {
       opacity: 0;
       transform: translateY(30px);
       transition:
        opacity 1.2s ease,
        transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-title {
      overflow: hidden;
    }

    .gallery-title span {
      display: inline-block;
      transform: translateY(100%);
      animation: titleReveal 1s forwards;
    }

@keyframes titleReveal {
  to {
    transform: translateY(0);
  }
}

    .gallery-header,
    .gallery-grid {
      animation: pageFade 1.4s ease;
    }

    @keyframes pageFade {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 1.5rem;
      }

      .gallery-grid {
        column-count: 1;
      }

      .gallery-title {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>

  <a href="portfolio.html" class="back-link">
    ← Back to Portfolio
  </a>

  <div class="gallery-header">
    <h1 class="gallery-title">
      </span>world of my friends</span>
    </h1>

    <p class="gallery-description">
      the world is your studio, i'm just here to capture it
    </p>
  </div>

  <div class="gallery-grid">

    <img class="reveal" src="images/friends1.JPG">
    <img class="reveal" src="images/friends2.JPG">
    <img class="reveal" src="images/friends3.JPG">
    <img class="reveal" src="images/friends4.JPG">
    <img class="reveal" src="images/friends5.JPG">
    <img class="reveal" src="images/friends6.JPG">
    <img class="reveal" src="images/friends7.JPG">
    <img class="reveal" src="images/friends8.JPG">
    <img class="reveal" src="images/friends9.JPG">
    <img class="reveal" src="images/friends10.JPG">
    <img class="reveal" src="images/friends11.JPG">
    <img class="reveal" src="images/friends12.JPG">
    <img class="reveal" src="images/friends13.JPG">
    <img class="reveal" src="images/friends14.JPG">
    <img class="reveal" src="images/friends15.JPG">


  </div>

 <script>
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("img").forEach(img => {
        img.addEventListener("contextmenu", e => e.preventDefault());
      });
    });
  </script>

<script>
  const reveals = document.querySelectorAll(".reveal");

  const observer = new IntersectionObserver(entries => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
      } else {
        entry.target.classList.remove("visible");
      }
    });
  }, {
    threshold: 0.15
  });

  reveals.forEach(reveal => {
    observer.observe(reveal);
  });
</script>

</body>
</html>
