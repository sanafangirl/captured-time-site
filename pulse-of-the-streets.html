<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pulse of the Streets</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: #f0ede8;
      font-family: 'Jost', sans-serif;
      padding: 3rem;
    }

    /* image protection */
    img {
      -webkit-user-drag: none;
      user-select: none;
    }

    .back-link {
      color: rgba(240,237,232,0.6);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

    .gallery-header {
      margin: 4rem 0;
    }

    .gallery-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      font-weight: 300;
      margin-bottom: 1rem;
    }

    .gallery-description {
      max-width: 600px;
      line-height: 1.8;
      color: rgba(240,237,232,0.6);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 1rem;
    }

    .gallery-grid img {
      width: 100%;
      display: block;
      object-fit: cover;
    }

    @media (max-width: 768px) {
      body {
        padding: 1.5rem;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-title {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>

  <a href="portfolio.html" class="back-link">
    ← Back to Portfolio
  </a>

  <div class="gallery-header">
    <h1 class="gallery-title">pulse of the streets</h1>

    <p class="gallery-description">
      life moves fast; these images pause the fleeting beat of the streets and environment
    </p>
  </div>

  <div class="gallery-grid">

    <img src="images/pulse1.JPG">
    <img src="images/pulse2.JPG">
    <img src="images/pulse3.JPG">
    <img src="images/pulse4.JPG">
    <img src="images/pulse5.JPG">
    <img src="images/pulse6.JPG">
    <img src="images/pulse7.JPG">

  </div>

 <script>
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("img").forEach(img => {
        img.addEventListener("contextmenu", e => e.preventDefault());
      });
    });
  </script>

</body>
</html>
