<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Pulse of the Streets</title>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Jost:wght@300;400&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #080808;
      color: #f0ede8;
      font-family: 'Jost', sans-serif;
      padding: 3rem;
    }

    /* image protection */
    img {
      -webkit-user-drag: none;
      user-select: none;
    }

    .back-link {
      color: rgba(240,237,232,0.6);
      text-decoration: none;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      font-size: 0.7rem;
    }

     .back-link:hover {
      opacity: 1;
    }

    .gallery-header {
      margin: 4rem 0;
    }

    .gallery-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 4rem;
      font-weight: 300;
      margin-bottom: 1rem;
    }

     .gallery-title span {
      display: inline-block;
      transform: translateY(100%);
      animation: titleReveal 1s forwards;
    }

    @keyframes titleReveal {
      to {
        transform: translateY(0);
      }
    }

    .gallery-description {
      max-width: 600px;
      line-height: 1.8;
      color: rgba(240,237,232,0.6);
    }

    .gallery-grid {
      column-count: 2;
      column-gap: 1rem;

      max-width: 1500px;
      margin: 0 auto;

      animation: pageFade 1.4s ease;
    }

    .gallery-grid img {
      width: 100%;
      display: block;
       margin-bottom: 1rem;

      break-inside: avoid;
      border-radius: 2px;

      transition:
        transform 0.4s ease,
        opacity 0.4s ease,
        filter 0.4s ease;
    }

    .gallery-grid img:hover {
      transform: scale(1.02) translateY(-4px);
      filter: brightness(1.05);
    }

    .reveal {
      opacity: 0;
      transform: translateY(30px);
      transition:
        opacity 1.2s ease,
        transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .reveal.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-header {
      animation: pageFade 1.4s ease;
    }

    @keyframes pageFade {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 768px) {
      body {
        padding: 1.5rem;
      }

      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .gallery-title {
        font-size: 2.5rem;
      }
    }
  </style>
</head>

<body>

  <a href="portfolio.html" class="back-link">
    ← Back to Portfolio
  </a>

  <div class="gallery-header">
    <h1 class="gallery-title">
      <span>pulse of the streets</span>
    </h1>

    <p class="gallery-description">
      life moves fast; these images pause the fleeting beat of the streets and environment
    </p>
  </div>

  <div class="gallery-grid">

    <img src="images/pulse1.JPG">
    <img src="images/pulse2.JPG">
    <img src="images/pulse3.JPG">
    <img src="images/pulse4.JPG">
    <img src="images/pulse5.JPG">
    <img src="images/pulse6.JPG">
    <img src="images/pulse7.JPG">
    <img src="images/pulse8.JPG">
    <img src="images/pulse9.JPG">
    <img src="images/pulse10.JPG">
    <img src="images/pulse11.JPG">
    <img src="images/pulse12.JPG">
    <img src="images/pulse13.JPG">

  </div>

    <!-- right click protection -->
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("img").forEach(img => {
        img.addEventListener("contextmenu", e => e.preventDefault());
      });
    });
  </script>

  <!-- reveal on scroll -->
  <script>
    const reveals = document.querySelectorAll(".reveal");

    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          entry.target.classList.add("visible");
        } else {
          entry.target.classList.remove("visible");
        }
      });
    }, {
      threshold: 0.15
    });

    reveals.forEach(reveal => {
      observer.observe(reveal);
    });
  </script>

</body>
</html>
